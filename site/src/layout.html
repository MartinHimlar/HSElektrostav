<!DOCTYPE html>
<html lang="cs">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<meta name="description" content="{{description}}">
	<meta name="theme-color" content="#1A8619">

	<meta property="og:title" content="{{title}}">

				<span class="sr-only">Menu</span>
			</button>

			<nav class="site-nav" id="hlavni-menu" aria-label="Hlavní menu" data-nav>

					+420 777 715 545
				</a>
			</nav>
		</div>
	</header>

	<main id="obsah">
{{content}}
	</main>

	<footer class="site-footer">
		<div class="container footer-inner">
			<div class="footer-brand">
				<img src="/images/logo.png" width="69" height="44" alt="HS Elektrostav">
				<p>HS Elektrostav s.r.o.<br>Lidická 1261/43c, Havířov - Šumbark</p>

			<ul class="footer-links">
				<li><a href="tel:+420777715545">+420 777 715 545</a></li>

			</ul>
